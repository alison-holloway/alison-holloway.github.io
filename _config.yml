# Site settings
title: Alison Holloway
tagline: Senior Technical Writer
description: Senior technical writer for developer and platform-engineering audiences. Docs-as-code, Kubernetes, enterprise Linux, and content designed so people and AI assistants can find and use it accurately.
baseurl: "" # Leave empty for GitHub Pages at username.github.io
url: "https://www.alison-holloway.com"

# Author information
author:
  name: Alison Holloway
  email: alison.holloway@pm.me
  linkedin: alison-holloway-au
  github: alison-holloway
  location: Melbourne, Victoria, Australia

# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-admin

# Collections
collections:
  portfolio:
    output: true
    permalink: /portfolio/:title/

# Defaults
defaults:
  # Link-preview image (og:image) for every page; pages with their own card
  # override it with `image:` in front matter. Generated by `npm run social-cards`.
  - scope:
      path: ""
    values:
      image: /assets/images/social/default.png
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "portfolio-item"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md