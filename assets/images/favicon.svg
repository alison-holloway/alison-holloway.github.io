<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #b45309; }
    .mark { fill: #fdf6ee; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #fbbf24; }
      .mark { fill: #1c1008; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <!-- Three lines of text with a typing cursor -->
  <rect class="mark" x="6" y="8" width="20" height="3.2" rx="1.6"/>
  <rect class="mark" x="6" y="14.4" width="20" height="3.2" rx="1.6"/>
  <rect class="mark" x="6" y="20.8" width="10" height="3.2" rx="1.6"/>
  <rect class="mark" x="19" y="18.6" width="2.6" height="7.6" rx="1.3"/>
</svg>
